name: Afto-API CI/CD Staging

on:
  push:
    branches: [new-staging]
    paths:
      - 'afto_api/**'
  workflow_dispatch:  

env:
  AFTO_API_CONTAINER_NAME: afto-api
  AFTO_API_IMAGE_NAME: afto_api
  RESOURCE_GROUP: Afto-test-cloud-scale
  IMAGE_NAME: aftoapp-d0hya5degbdcfzfd
  NODE_ENV: staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME_STAGING }}

    - name: Build and push Docker image
      run: |
        cd afto_api
        docker build \
          --build-arg NODE_ENV=${{ env.NODE_ENV }} \
          -t ${{ env.IMAGE_NAME }}.azurecr.io/${{ env.AFTO_API_IMAGE_NAME }}:${{ github.sha }} .
        docker push ${{ env.IMAGE_NAME }}.azurecr.io/${{ env.AFTO_API_IMAGE_NAME }}:${{ github.sha }}

    - name: Update Container App
      run: |
        az containerapp update \
          --name ${{ env.AFTO_API_CONTAINER_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.IMAGE_NAME }}.azurecr.io/${{ env.AFTO_API_IMAGE_NAME }}:${{ github.sha }}
